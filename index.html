<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CorteHype · Em manutenção</title>
<meta property="og:title" content="CorteHype · Em manutenção">
<meta property="og:description" content="Estamos preparando novidades. Volte em breve.">
<meta property="og:image" content="https://cortehype.com.br/og.png">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Albert+Sans:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--line:#24242b;--ink:#fafafa;--muted:#a1a1aa;--rec:#ff2d3f;--score:#ff8a1f;--grad:linear-gradient(90deg,#ff2d3f,#ff7a1a)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0%,rgba(255,45,63,.14),transparent 60%),var(--bg);color:var(--ink);font:16px/1.55 "Albert Sans","Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px;text-align:center;-webkit-font-smoothing:antialiased}
main{max-width:460px;display:grid;gap:20px;justify-items:center}
img{width:72px;height:72px;border-radius:18px}
.rec{font:500 12px "JetBrains Mono",ui-monospace,monospace;color:var(--score);letter-spacing:.12em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px}
.rec:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rec);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
h1{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;text-transform:uppercase;font-size:clamp(44px,13vw,72px);line-height:.9;margin:0}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--muted);margin:0;font-size:17px}
.bar{width:100%;max-width:260px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:var(--grad);border-radius:4px;animation:b 1.8s ease-in-out infinite}
@keyframes b{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.rec:before,.bar i{animation:none}}
</style>
</head>
<body>
<main>
  <img src="icone.png" alt="CorteHype">
  <div class="rec">Em manutenção</div>
  <h1>Estamos <span>editando</span> algo novo</h1>
  <p>O CorteHype está passando por melhorias. Volte em breve para ver as novidades.</p>
  <div class="bar" aria-hidden="true"><i></i></div>
</main>
</body>
</html>
